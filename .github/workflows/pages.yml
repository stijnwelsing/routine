name: pages

on:
  push:
    branches:
      - main
      - cursor/routine-vite-vandaag-14fe
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build Vite preview
        working-directory: app
        run: npm ci && npm run build:pages
      - name: Assemble site without touching legacy root
        run: |
          mkdir -p site/preview
          cp index.html site/index.html
          cp -R legacy site/legacy
          cp -R preview/. site/preview/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
